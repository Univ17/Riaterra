<!DOCTYPE html>

canvas { display:block; width:100%; height:100%; cursor:crosshair; touch-action:none; }
</style></head>
<body><canvas id="c"></canvas>
<script>
// =====================================================================
// 1. CONSTANTS AND TILE TYPES
// =====================================================================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const TILE = 16;            // pixels per tile
const WORLD_W = 300;        // world width in tiles
const WORLD_H = 110;        // world height in tiles
const ZOOM = 2;             // screen pixels per world pixel

const AIR = 0, DIRT = 1, STONE = 2, GRASS = 3, ORE = 4, WOOD = 5, LEAVES = 6;
const PLATFORM = 7, DOOR = 8, DOOR_OPEN = 9;   // drawn specially, so no entry in TILE_COLORS
const SILVER = 10;                              // silver ore (the existing ORE tile is the gold ore)
const BUSH = 11;                                // berry bush: walk-through decoration that drops berries
const TILE_COLORS = [null, '#8b5a2b', '#7a7f88', '#8b5a2b', '#7a7f88', '#6b4423', '#2e7d32'];
TILE_COLORS[SILVER] = '#7a7f88';
TILE_COLORS[BUSH] = '#2a6f2e';

const GRAVITY = 0.3, MAX_FALL = 8;
const REACH = TILE * 5.5;   // how far the player can mine/place

const world = new Uint8Array(WORLD_W * WORLD_H);   // one byte per tile

// ---- Textures: a 3x3 sheet of 16x16 sprites, embedded as base64 ----
const sheet = new Image();
sheet.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAAC8ElEQVR42u1XzWsTQRR/GRetELSSTQIiVQi9CLmkVC0YjyII+Sd6EMRjLv4B0kuOoX+AIB48FsGDtz3UD7biTQq9lCIEWxpCL+1hx4PMOvsy3zNrVfYHS+ZjX/J7837vvUlt/OQ2TWcdWLmyByIcTU+gsVgHGT49vg4+6H57KFy/t7YGH7a3tfYEAOBW9lX6gox8OuvA0fQEyoIJeQCASEVShV8Rq8OeJ9Efh4fad5pxrI6AKco48WYcQzOOIcuyuYftMUlJI2Cqe5dImaLdajlJitjo3hZ33n7XzmUny0tM9RBRcuqkw88xqQuvLxfWZE6wT12yMnlhqbE5wYRE5RRHBM87r3ZzUrJyrIqEjbzarVZhTkJIRmSvk49OIqrE5deJSeURycr0VHWVSyYNlbz49UhXfRqLdWgYVnupvYFkdFVI2chCVZ+QZdakwUn7gA6qu5OrPb77ZFlmFBWnTuxKXmWP9W4qqUikW5tO7GtvexfCkSL4S9NZx1jLIqK29qI7EH5Ukaq9eXGf+iTbVnfBK1lfDt7XfOxJqKqxvzOB/Z0J/GnkVWhyfPo7ga5dytfYWPaOrZMAAEu9djgH3n30PLXuzeCkGMbDVQoA8Gz0WSqz6NFdvx/esjhtGycZeTaWOUHgLwRPXrU258Dk+LSgc6x7DNXeUq9dOHHTJBfJho1FTvjnwIOrwRIVk/+yOwXeifFwlWI5lZYDoojooEpW2X4UWr9lVCNlIxPpmK3Z5sR5IOJ15tMHbLQfsqGVngNldN9ScsCGYNCrhOjOw+tddxfSnTBeDx0R/z7QW4AKFf5XJElCkyRx/suZHpzR9ODM2X5jtEk3RpvU6S8lT9zFCZ64ixM8cZUTREfexQkRYRsnRIRlThAZ0X6/n9/82NjECUZ05cbF3J6NTZxgRJ8Pn+b2bKyT05zm1wfLdH2wTE1zAmse2+tyAmse24tyonCV4E9dBN0+f+ou+/ypm+6Tf71SVg5UDlQOVA6cL34CZVIYm1raLfYAAAAASUVORK5CYII=';
// Sprite positions on the sheet as [column, row].
const TILE_SPRITES = { [DIRT]: [0, 0], [GRASS]: [1, 0], [STONE]: [2, 0], [ORE]: [2, 0], [SILVER]: [2, 0], [WOOD]: [0, 1], [LEAVES]: [1, 1] };
const ITEM_SPRITES = { dirt: [0, 0], stone: [2, 0], wood: [0, 1], leaves: [1, 1] };
const PICKAXE_SPRITE = [2, 1], SILVER_PICKAXE_SPRITE = [1, 2], STONE_PICKAXE_SPRITE = [2, 2];
const PICK_SPRITES = { pickaxe: PICKAXE_SPRITE, stone_pickaxe: STONE_PICKAXE_SPRITE, silver_pickaxe: SILVER_PICKAXE_SPRITE };
function drawSprite(sprite, x, y, w, h) {
  ctx.drawImage(sheet, sprite[0] * 16, sprite[1] * 16, 16, 16, x, y, w, h);
}

// Read a tile. Outside the sides/bottom counts as stone; above the world is air.
function getTile(x, y) {
  if (x < 0 || x >= WORLD_W || y >= WORLD_H) return STONE;
  if (y < 0) return AIR;
  return world[y * WORLD_W + x];
}
function setTile(x, y, type) { world[y * WORLD_W + x] = type; }

// Solid tiles block movement. Leaves, open doors and platforms do not block
// sideways movement or bullets (platforms are handled separately in moveBody).
function isSolid(x, y) {
  const t = getTile(x, y);
  return t !== AIR && t !== LEAVES && t !== PLATFORM && t !== DOOR_OPEN && t !== BUSH;
}

// =====================================================================
// 2. WORLD GENERATION
// =====================================================================
const seed = Math.random() * 1000;

// Pseudo-random number in [0,1) for a grid point, stable for a given seed.
function hash(x, y) {
  const n = Math.sin(x * 127.1 + y * 311.7 + seed) * 43758.5453;
  return n - Math.floor(n);
}

// Smooth "value noise": blends the hashes of the 4 surrounding grid points.
function valueNoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const fx = x - xi, fy = y - yi;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);   // smoothstep
  const top    = hash(xi, yi)     * (1 - u) + hash(xi + 1, yi)     * u;
  const bottom = hash(xi, yi + 1) * (1 - u) + hash(xi + 1, yi + 1) * u;
  return top * (1 - v) + bottom * v;
}

// Surface height (in tiles from the top) for each column: layered sine waves.
const surface = [];
for (let x = 0; x < WORLD_W; x++) {
  surface[x] = Math.floor(40 + 8 * Math.sin(x * 0.05 + seed)
                             + 5 * Math.sin(x * 0.13 + 2)
                             + 3 * Math.sin(x * 0.31));
}

function generateTerrain() {
  for (let x = 0; x < WORLD_W; x++) {
    const top = surface[x];
    for (let y = top; y < WORLD_H; y++) {
      // Grass on top, then a few tiles of dirt, then stone.
      let tile;
      if (y === top) tile = GRASS;
      else if (y < top + 6 + hash(x, 7) * 3) tile = DIRT;
      else tile = STONE;

      // Caves: carve out air where noise is high, but not near the surface.
      if (y > top + 5) {
        const n = valueNoise(x / 8, y / 8) * 0.67 + valueNoise(x / 4, y / 4) * 0.33;
        if (n > 0.62) tile = AIR;
      }
      // Ore: rare random speckles inside stone (gold is rarer than silver).
      if (tile === STONE) {
        if (hash(x, y) < 0.03) tile = ORE;
        else if (hash(x + 211, y + 97) < 0.04) tile = SILVER;
      }
      // Solid floor at the bottom of the world.
      if (y >= WORLD_H - 2) tile = STONE;

      setTile(x, y, tile);
    }
  }
}

function generateTrees() {
  for (let x = 4; x < WORLD_W - 4; x++) {
    const onGrass = getTile(x, surface[x]) === GRASS;
    if (!onGrass || hash(x, 99) >= 0.09) continue;

    const height = 3 + Math.floor(hash(x, 5) * 3);
    const treeTop = surface[x] - height;
    for (let y = surface[x] - 1; y >= treeTop; y--) setTile(x, y, WOOD);        // trunk
    for (let dy = -2; dy <= 1; dy++) {                                          // leaf blob
      for (let dx = -2; dx <= 2; dx++) {
        const tx = x + dx, ty = treeTop + dy;
        if (getTile(tx, ty) === AIR && Math.abs(dx) + Math.abs(dy) < 4) setTile(tx, ty, LEAVES);
      }
    }
    x += 3;   // leave a gap before the next tree
  }
}

// Berry bushes: small bushes on open grass (never on a tree trunk).
function generateBushes() {
  for (let x = 2; x < WORLD_W - 2; x++) {
    const y = surface[x] - 1;
    if (getTile(x, surface[x]) === GRASS && getTile(x, y) === AIR && hash(x, 321) < 0.12) setTile(x, y, BUSH);
  }
}

generateTerrain();
generateTrees();
generateBushes();

// =====================================================================
// 3. GAME STATE
// =====================================================================
const SPAWN_X = (WORLD_W / 2) * TILE;
const SPAWN_Y = (surface[WORLD_W / 2] - 3) * TILE;

const player = {
  x: SPAWN_X, y: SPAWN_Y, w: 12, h: 26,
  vx: 0, vy: 0,
  hp: 100, facing: 1,
  invincibleFrames: 0,   // brief immunity after being hit
  dropFrames: 0,         // while > 0, fall through platforms
  onGround: false,
};

let enemies = [];
let bullets = [];
let angelSwords = [];         // swords thrown by the Descendant (fly through blocks)
let slimeBalls = [];          // projectiles shot by the boss
let maxHp = 100;              // raised by defeating the Big Bad Eye
let hasBetterGun = false;     // Slime Gun (dropped by Slime King)
let hasBossSword = false;     // Big Bad Sword (dropped by Big Bad Eye)
let slimeKingDefeated = false;// Tracks if the Slime King has been slain
let hasWings = false;         // crafted from 4 angel tears: hold jump in the air to fly
let hasInfiniteWings = false; // crafted from 4 God's Tears (dropped by purple eyelets)
let eyeDefeated = false;      // set when the Big Bad Eye dies; purple eyelets only spawn after that
const FLIGHT_MAX = 180;       // 3 seconds of flight, refilled when you touch the ground
let flightTime = FLIGHT_MAX, wingsArmed = false;
let hasSlimeBoots = false;    // crafted from 10 gel: Shift dashes the way you are facing
const DASH_SPEED = 10, DASH_FRAMES = 16, DASH_COOLDOWN = 180;   // 10 px x 16 frames = 160 px = 10 tiles
let dashFrames = 0, dashCooldown = 0, dashDir = 1, dashWasDown = false, dashEndPending = false, dashTrail = [];

// ---- Items and inventory ----
// Every item the player can hold. Items with a `tile` can be placed in the world.
const ITEMS = {
  sword:    { name: 'Sword',    color: '#ccd' },
gun:      { name: 'Gun',      color: '#777', crafted: true },
  pickaxe:  { name: 'Wood Pick', color: '#bbb', pick: 0 },
  stone_pickaxe:  { name: 'Stone Pick',  color: '#889', pick: 1, crafted: true },
  silver_pickaxe: { name: 'Silver Pick', color: '#cde', pick: 2, crafted: true },
  silver_sword:   { name: 'Silver Sword', slot: 'S. Sword', color: '#cde', crafted: true },   // crafted from 8 silver + 2 wood
  dirt:     { name: 'Dirt',     color: '#8b5a2b', tile: DIRT },
  stone:    { name: 'Stone',    color: '#7a7f88', tile: STONE },
  ore:      { name: 'Gold',     color: '#f0c040', tile: ORE },
  silver:   { name: 'Silver',   color: '#d6dde6', counted: true },   // material only: used for crafting
  artefact: { name: 'Artefact', color: '#6df',    counted: true },   // dropped by eyelets; craft it with the gun
  berry:    { name: 'Berry',    color: '#c2185b', counted: true },   // picked from berry bushes; 3 craft a potion
  angel_tear: { name: "Angel's Tear", slot: 'Tear', color: '#bfe6ff', counted: true },   // dropped by eyelets; 4 craft the Wings
  god_tear: { name: "God's Tear", slot: 'G. Tear', color: '#e9c8ff', counted: true },   // dropped by purple eyelets; 4 craft the Infinite Wings
  ancient_artefact: { name: 'Ancient Artefact', slot: 'Anc. Art.', color: '#ffd24a', counted: true },   // dropped by golden eyelets; 3 craft the Descendant Sigil
  sigil:    { name: 'Descendant Sigil', slot: 'Sigil', color: '#fff0b3', counted: true },               // click it to summon the Descendant
  gel:      { name: 'Gel',      color: '#3ecf8e', counted: true },   // dropped by slimes; 10 craft the Slime Boots
  wood:     { name: 'Wood',     color: '#6b4423', tile: WOOD },
  leaves:   { name: 'Leaves',   color: '#2e7d32', tile: LEAVES },
  platform: { name: 'Platform', color: '#a0693a', tile: PLATFORM },
  door:     { name: 'Door',     color: '#a0693a', tile: DOOR },
  book:     { name: 'Book',     color: '#8a2be2', counted: true },   // summons the Big Bad Eye
  potion:   { name: 'Potion',   color: '#e33', counted: true },      // heals 50 health
  honza:    { name: 'Honza',    color: '#3ecf8e', crafted: true }, // crazy ass dev gun
};
const ITEM_ORDER = Object.keys(ITEMS);
const inventory = { dirt: 40, platform: 20, door: 4, potion: 5 };   // item id -> count (materials only)
const hotbar = ['sword', 'pickaxe', null, null, null, null, null, null, null, null];
const HOTBAR_SIZE = hotbar.length;
let selectedSlot = 0;
let inventoryOpen = false;

let toastText = '', toastFrames = 0;   // short centered message
function showToast(text) { toastText = text; toastFrames = 150; }

const heldItem = () => hotbar[selectedSlot];
const isPlaceable = id => !!(id && ITEMS[id].tile);
const itemCount = id => inventory[id] || 0;
function itemName(id) {
  if (id === 'sword' && hasBossSword) return 'Big Bad Sword';
  if (id === 'gun' && hasBetterGun) return 'Slime Gun';
  return ITEMS[id].name;
}

// Add collected materials; a new material goes into the first empty hotbar slot.
function addItem(id, n = 1) {
  inventory[id] = itemCount(id) + n;
  if (!hotbar.includes(id)) {
    const free = hotbar.indexOf(null);
    if (free >= 0) hotbar[free] = id;
  }
}

// What a tile gives you when mined.
function dropFor(tile) {
  return { [DIRT]: 'dirt', [GRASS]: 'dirt', [STONE]: 'stone', [ORE]: 'ore', [SILVER]: 'silver', [WOOD]: 'wood',
           [LEAVES]: 'leaves', [PLATFORM]: 'platform', [DOOR]: 'door', [DOOR_OPEN]: 'door', [BUSH]: 'berry' }[tile];
}

// ---- Crafting (Terraria style) ----
// Recipes show up in the inventory panel (E): hover one to see its ingredients, click to craft it
// (Shift+click crafts as many as you can afford). Recipes you can afford light up green.
// Tools and the Rifle can only be crafted once; platforms and potions can be crafted again and again.
//   cost:  ingredients (item id -> amount)      gives: how many items one craft makes
//   done() (optional): true once a one-time recipe is already crafted
//   make(): hands over the result
function upgradeTool(newId, oldId) {                // new tool takes over the old tool's hotbar slot
  inventory[newId] = 1;
  const slot = hotbar.indexOf(oldId);
  if (slot >= 0) hotbar[slot] = newId; else addItem(newId);
}
const RECIPES = [
  { icon: 'stone_pickaxe',  label: 'Stone Pick',  name: 'Stone Pickaxe',  cost: { wood: 2, stone: 8 },
    done: () => itemCount('stone_pickaxe') > 0,  make: () => upgradeTool('stone_pickaxe', 'pickaxe') },
  { icon: 'silver_pickaxe', label: 'Silver Pick', name: 'Silver Pickaxe', cost: { wood: 2, silver: 8 },
    done: () => itemCount('silver_pickaxe') > 0, make: () => upgradeTool('silver_pickaxe', 'stone_pickaxe') },
  { icon: 'silver_sword',   label: 'S. Sword',    name: 'Silver Sword',   cost: { wood: 2, silver: 8 }, desc: 'Deals 28 damage',
    done: () => itemCount('silver_sword') > 0,   make: () => addItem('silver_sword') },
  { icon: 'platform',       label: 'Platform',    name: 'Platform',       cost: { wood: 1 },   gives: 2,
    make: () => addItem('platform', 2) },
  { icon: 'potion',         label: 'Potion',      name: 'Health Potion',  cost: { berry: 3 },  gives: 1,
    make: () => addItem('potion') },
  { icon: 'gun', label: 'Gun', name: 'Gun', cost: { ore: 10, silver: 5 }, color: '#777',
    desc: 'Fires bullets towards your cursor',
    done: () => itemCount('gun') > 0 || hasBetterGun,
    make: () => addItem('gun') },
  { icon: 'wings',          label: 'Wings',       name: 'Wings',          cost: { angel_tear: 4 }, color: '#f4f4ff',
    desc: 'Let go of jump in the air, then hold it to fly',
    toast: 'Crafted Wings!\nLet go of jump in the air, then hold it to fly.',
    done: () => hasWings,                        make: () => { hasWings = true; } },
  { icon: 'god_tear',       label: 'Inf Wings',   name: 'Infinite Wings', cost: { god_tear: 4 }, color: '#c77dff',
    desc: 'Upgrades your Wings: unlimited flight',

  { icon: 'boots',          label: 'Boots',       name: 'Slime Boots',    cost: { gel: 10 }, color: '#3ecf8e',
    desc: 'Press Shift to dash the way you are facing',

    done: () => hasSlimeBoots,                   make: () => { hasSlimeBoots = true; } },
  { icon: 'sigil',          label: 'Sigil',       name: 'Descendant Sigil', cost: { ancient_artefact: 3 }, gives: 1, color: '#fff0b3',
    desc: 'Click it to summon the Descendant',
    toast: 'Crafted the Descendant Sigil!\nClick with it to summon the Descendant.',
    make: () => addItem('sigil') },
];

// ---- Debug Menu Actions ----
let debugOpen = false;   // the debug buttons stay hidden until the Debug button in the inventory is clicked
const DEBUG_ACTIONS = [
  { label: 'Inf Wings', action: () => { hasWings = true; hasInfiniteWings = true; showToast('Infinite Wings granted!'); } },
  { label: 'Best Sword', action: () => { hasBossSword = true; addItem('sword'); showToast('Big Bad Sword unlocked!'); } },
  { label: 'Best Gun', action: () => { hasBetterGun = true; addItem('gun'); showToast('Slime Gun unlocked!'); } },
  { label: 'Honza', action: () => { addItem('honza'); showToast('Honza unlocked!'); } },
  { label: 'Spawn Slime', action: () => { spawnBoss(player.x, player.y - 60); } },
  { label: 'Spawn Eye', action: () => {
    enemies.push({ kind: 'eye', x: player.x - 20, y: player.y - 260, w: 40, h: 40, vx: 0, vy: 0, hp: 5000, maxHp: 5000, damage: 25, state: 'hover', timer: 120, dashes: 0, t: 0 });
    showToast('Big Bad Eye spawned!');
  }},
  { label: 'Descendant', action: () => { spawnDescendant(); } },
  { label: 'Full Heal', action: () => { player.hp = maxHp; showToast('Health restored!'); } },
  { label: '+50 Max HP', action: () => { maxHp += 50; player.hp = maxHp; showToast('Max HP: ' + maxHp); } },
  { label: 'Set 500 HP', action: () => { maxHp = 500; player.hp = 500; showToast('HP set to 500!'); } },
  { label: 'Best Pick', action: () => {
    if (!hotbar.includes('silver_pickaxe')) upgradeTool('silver_pickaxe', hotbar.includes('stone_pickaxe') ? 'stone_pickaxe' : 'pickaxe');
    showToast('Silver Pickaxe unlocked!');
  }},
  { label: '+100 Platforms', action: () => { addItem('platform', 100); showToast('+100 Platforms'); } },
  { label: 'Slime Boots', action: () => { hasSlimeBoots = true; showToast('Slime Boots granted!\nPress Shift to dash the way you are facing.'); } },
];

const isDone = r => !!(r.done && r.done());
const canCraft = r => !isDone(r) && Object.entries(r.cost).every(([id, n]) => itemCount(id) >= n);
function craft(r, all = false) {
  if (!canCraft(r)) return;
  let made = 0;
  while (canCraft(r)) {                                       // `all` (Shift+click) keeps going until the materials run out
    for (const [id, n] of Object.entries(r.cost)) inventory[id] -= n;
    r.make();
    made += r.gives || 1;
    if (!all) break;
  }
  showToast(r.toast || ('Crafted ' + r.name + (made > 1 ? ' x' + made : '') + '!'));
}
let cooldown = 0;           // frames until the next use is allowed
let swingFrames = 0;        // frames left in the current sword swing
let swingAlreadyHit = new Set();   // enemies hit during this swing
let swingItem = 'sword';           // which sword started the current swing
let kills = 0;
let spawnTimer = 60;
let mining = { x: -1, y: -1, progress: 0, need: 1 };

const camera = { x: 0, y: 0 };
let viewW = 0, viewH = 0;   // visible area in world pixels

// =====================================================================
// 4. INPUT
// =====================================================================
const keys = {};
// Hotbar slots 1-10 are the Czech number row: + ě š č ř ž ý á í é
const CZ_SLOT_KEYS = ['+', 'ě', 'š', 'č', 'ř', 'ž', 'ý', 'á', 'í', 'é'];
let mouseX = 0, mouseY = 0;          // screen pixels
const UI_SCALE = 1.5;                // HUD and inventory are drawn 50% bigger
let uiDrag = null;                   // {dx, dy} while the inventory panel is being dragged
let panelOffX = 0, panelOffY = 0;    // how far the player has dragged the inventory panel
const uiW = () => canvas.width / UI_SCALE, uiH = () => canvas.height / UI_SCALE;   // screen size in UI units
const uiMX = () => mouseX / UI_SCALE, uiMY = () => mouseY / UI_SCALE;              // mouse in UI units
let leftDown = false, rightDown = false;

addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  const czSlot = CZ_SLOT_KEYS.indexOf(e.key.toLowerCase());
  if (czSlot >= 0) selectedSlot = czSlot;
  else if (/^Digit\d$/.test(e.code)) selectedSlot = (Number(e.code.slice(5)) + 9) % 10;   // same physical keys (also works with Caps Lock)
  if (e.key === 'Escape') { inventoryOpen = false; carry = null; }
  if (e.key.toLowerCase() === 'h' && !e.repeat && !inventoryOpen) usePotion();   // quick heal
  if ((e.key.toLowerCase() === 'e' || e.key === 'Tab') && !e.repeat) {          // toggle inventory
    inventoryOpen = !inventoryOpen;
    carry = null;
    leftDown = rightDown = false;
    e.preventDefault();
  }
  if (e.key === ' ') e.preventDefault();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouseX = e.clientX - r.left;
  mouseY = e.clientY - r.top;
  if (uiDrag) {                                       // dragging the inventory panel
    panelOffX = uiMX() - uiDrag.dx;
    panelOffY = uiMY() - uiDrag.dy;
    clampPanel();
  }
});
canvas.addEventListener('mousedown', e => {
  if (inventoryOpen) { if (e.button === 0) clickInventory(e.shiftKey); return; }   // clicks go to the panel
  if (e.button === 0) leftDown = true; else rightDown = true;
});
addEventListener('mouseup',          e => { if (e.button === 0) { leftDown = false; uiDrag = null; if (inventoryOpen) releaseInventory(); } else rightDown = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => {
  selectedSlot = (selectedSlot + (e.deltaY > 0 ? 1 : HOTBAR_SIZE - 1)) % HOTBAR_SIZE;
}, { passive: true });

// Mouse position converted to world coordinates.
const mouseWorldX = () => mouseX / ZOOM + camera.x;
const mouseWorldY = () => mouseY / ZOOM + camera.y;

function resize() {
  const r = canvas.getBoundingClientRect();
  canvas.width = r.width;
  canvas.height = r.height;
  viewW = canvas.width / ZOOM;
  viewH = canvas.height / ZOOM;
}
addEventListener('resize', resize);

// =====================================================================
// 5. PHYSICS (shared by the player and enemies)
// =====================================================================
// Does this body overlap any solid tile?
function collides(body) {
  const x0 = Math.floor(body.x / TILE);
  const x1 = Math.floor((body.x + body.w - 0.01) / TILE);
  const y0 = Math.floor(body.y / TILE);
  const y1 = Math.floor((body.y + body.h - 0.01) / TILE);
  for (let y = y0; y <= y1; y++)
    for (let x = x0; x <= x1; x++)
      if (isSolid(x, y)) return true;
  return false;
}

// Move horizontally, then vertically. On a collision, back out in small steps.
function moveBody(body) {
  body.onGround = false;
  body.blockedSideways = false;

  body.x += body.vx;
  if (body.vx && collides(body)) {
    const dir = Math.sign(body.vx);
    while (collides(body)) body.x -= dir * 0.25;
    body.vx = 0;
    body.blockedSideways = true;
  }

  const prevBottom = body.y + body.h;
  body.y += body.vy;
  if (body.vy && collides(body)) {
    const dir = Math.sign(body.vy);
    while (collides(body)) body.y -= dir * 0.25;
    if (dir > 0) body.onGround = true;   // landed on something
    body.vy = 0;
  }
  landOnPlatform(body, prevBottom);
}

// Platforms are one-way: you can jump up through them, but you land on top
// when falling, unless dropFrames > 0 (player is holding S/Down).
function landOnPlatform(body, prevBottom) {
  if (body.vy <= 0 || body.dropFrames > 0) return;
  const row = Math.floor((body.y + body.h) / TILE);
  if (row * TILE < prevBottom - 0.5) return;   // feet were already below the platform top
  const x0 = Math.floor(body.x / TILE);
  const x1 = Math.floor((body.x + body.w - 0.01) / TILE);
  for (let x = x0; x <= x1; x++) {
    if (getTile(x, row) === PLATFORM) {
      body.y = row * TILE - body.h;
      body.vy = 0;
      body.onGround = true;
      return;
    }
  }
}

// =====================================================================
// 6. ITEMS: SWORD, GUN, PICKAXE, BLOCKS
// =====================================================================
function useItem() {
  if (cooldown > 0) return;
  const px = player.x + player.w / 2, py = player.y + 8;
  const aimX = mouseWorldX() - px, aimY = mouseWorldY() - py;
  const aimLen = Math.hypot(aimX, aimY) || 1;
  player.facing = aimX >= 0 ? 1 : -1;

  const item = heldItem();
  if (item === 'sword' || item === 'silver_sword') {   // SWORD: start a swing
    swingItem = item;
    swingFrames = 14;
    swingAlreadyHit.clear();
    cooldown = 18;
  } else if (item === 'gun') {                 // GUN: fire a bullet toward the mouse
    bullets.push({ x: px, y: py, vx: aimX / aimLen * (hasBetterGun ? 12 : 9), vy: aimY / aimLen * (hasBetterGun ? 12 : 9), life: 70 });
    cooldown = hasBetterGun ? 14 : 24;
  } else if (item === 'gun' || item === 'honza') {   // dev gun
    bullets.push({ x: px, y: py, vx: aimX / aimLen * 12, vy: aimY / aimLen * 12, life: 70, honza: item === 'honza' });
    cooldown = 14;
  } else if (item && ITEMS[item].pick !== undefined) {   // PICKAXES: mine the tile under the mouse
    mineTile(ITEMS[item].pick);
  } else if (item === 'book') {                // OCCULT BOOK: summon the Big Bad Eye
    useBook();
  } else if (item === 'sigil') {               // DESCENDANT SIGIL: summon the Descendant
    useSigil();
  } else if (item === 'potion') {              // HEALING POTION
    usePotion();
  } else {                                     // any material: place it (does nothing on an empty slot)
    placeItem(item);
  }
}

// ---- Block breaking animation: cracks that grow as you dig, plus flying debris ----
// A fixed crack pattern (a list of pixels, ordered from the middle outward). The more
// progress you have made, the more of the list is drawn.
const CRACK_PIXELS = (() => {
  let r = 12345;
  const rnd = () => (r = (r * 1664525 + 1013904223) >>> 0) / 4294967296;
  const seen = new Set(), out = [];
  const add = (x, y) => {
    if (x < 0 || y < 0 || x >= TILE || y >= TILE || seen.has(x + ',' + y)) return false;
    seen.add(x + ',' + y); out.push([x, y]); return true;
  };
  const branches = [];
  for (let b = 0; b < 7; b++) {                       // each branch is a wobbly line leaving the centre
    const ang = (b / 7) * Math.PI * 2 + rnd() * 0.6;
    branches.push({ x: 7.5, y: 7.5, ang, len: 6 + Math.floor(rnd() * 4) });
  }
  for (let step = 0; step < 10; step++) {              // grow all branches one step at a time
    for (const br of branches) {
      if (step >= br.len) continue;
      br.ang += (rnd() - 0.5) * 0.9;
      br.x += Math.cos(br.ang); br.y += Math.sin(br.ang);
      add(Math.round(br.x), Math.round(br.y));
      if (rnd() < 0.25) add(Math.round(br.x) + (rnd() < 0.5 ? 1 : 0), Math.round(br.y));   // slightly thicker in places
    }
  }
  add(7, 7); add(8, 7); add(7, 8); add(8, 8);
  out.unshift(out.pop(), out.pop(), out.pop(), out.pop());   // the centre goes first
  return out;
})();

function drawBreakCracks() {
  if (!leftDown || mining.progress <= 0 || getTile(mining.x, mining.y) === AIR) return;
  const frac = Math.min(1, mining.progress / mining.need);
  const stage = Math.min(9, Math.floor(frac * 10));            // 10 stages, like Minecraft
  const px = mining.x * TILE, py = mining.y * TILE;
  ctx.fillStyle = 'rgba(0,0,0,' + (0.08 + frac * 0.22) + ')';   // the block darkens as it weakens
  ctx.fillRect(px, py, TILE, TILE);
  const count = Math.ceil(CRACK_PIXELS.length * (stage + 1) / 10);
  for (let i = 0; i < count; i++) {
    const [cx, cy] = CRACK_PIXELS[i];
    ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(px + cx, py + cy, 1, 1);
    if (i % 3 === 0) { ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(px + cx + 1, py + cy + 1, 1, 1); }   // faint highlight edge
  }
}

let debris = [];
const DEBRIS_COLORS = {
  [DIRT]: ['#8b5a2b', '#6e4520', '#a06a35'], [GRASS]: ['#4caf50', '#3d8c40', '#8b5a2b'],
  [STONE]: ['#7a7f88', '#5f646c', '#969ba3'], [ORE]: ['#7a7f88', '#f0c040', '#5f646c'],
  [SILVER]: ['#7a7f88', '#e8f0fa', '#5f646c'], [WOOD]: ['#6b4423', '#523318', '#85572d'],
  [LEAVES]: ['#2e7d32', '#1f5d23', '#43a047'], [BUSH]: ['#2a6f2e', '#c2185b', '#1f5d23'],
  [PLATFORM]: ['#9b6a3a', '#7a4f26'], [DOOR]: ['#9b6a3a', '#7a4f26'], [DOOR_OPEN]: ['#9b6a3a', '#7a4f26'],
};
function spawnDebris(tx, ty, type, n) {
  const cols = DEBRIS_COLORS[type] || ['#8b5a2b'];
  for (let i = 0; i < n; i++) {
    debris.push({
      x: tx * TILE + 2 + Math.random() * (TILE - 4), y: ty * TILE + 2 + Math.random() * (TILE - 4),
      vx: (Math.random() - 0.5) * (n > 1 ? 3 : 1.6), vy: -Math.random() * (n > 1 ? 3 : 1.8) - 0.3,
      size: Math.random() < 0.5 ? 2 : 3, life: 24 + Math.floor(Math.random() * 16),
      color: cols[Math.floor(Math.random() * cols.length)],
    });
  }
  if (debris.length > 300) debris.splice(0, debris.length - 300);
}
function updateDebris() {
  for (const d of debris) {
    d.vy += 0.2; d.x += d.vx; d.y += d.vy; d.vx *= 0.98; d.life--;
    if (isSolid(Math.floor(d.x / TILE), Math.floor((d.y + d.vy) / TILE)) && d.vy > 0) { d.vy *= -0.3; d.vx *= 0.6; }   // bounce on blocks
  }
  debris = debris.filter(d => d.life > 0);
}
function drawDebris() {
  for (const d of debris) {
    ctx.globalAlpha = Math.min(1, d.life / 10);
    ctx.fillStyle = d.color; ctx.fillRect(Math.round(d.x), Math.round(d.y), d.size, d.size);
  }
  ctx.globalAlpha = 1;
}

// Pickaxe power: 0 = starting pick, 1 = stone pick, 2 = silver pick.
// Frames needed per tile for [power 0, 1, 2]; null means that pickaxe can't break it.
const MINE_FRAMES = {
  soft:   [12, 8, 6],          // dirt, wood, leaves, platforms, doors...
  [STONE]:  [20, 14, 10],      // the wood pick can mine stone too, just slower
  [SILVER]: [null, 20, 12],    // needs at least a stone pickaxe
  [ORE]:    [null, null, 14],  // gold ore needs a silver pickaxe
  [BUSH]:   [4, 3, 2],        // berry bushes are quick to pick
};
const NEEDS_TOAST = { [SILVER]: 'Silver ore needs a stone pickaxe', [ORE]: 'Gold ore needs a silver pickaxe' };

function mineTile(power) {
  const tx = Math.floor(mouseWorldX() / TILE), ty = Math.floor(mouseWorldY() / TILE);
  const px = player.x + player.w / 2, py = player.y + 8;
  const inReach = Math.hypot(tx * TILE + 8 - px, ty * TILE + 8 - py) < REACH;
  if (!inReach || getTile(tx, ty) === AIR) return;
  const type = getTile(tx, ty);

  const framesNeeded = (MINE_FRAMES[type] || MINE_FRAMES.soft)[power];
  if (framesNeeded === null) {                       // this pickaxe is too weak for the tile
    if (toastFrames <= 0) showToast(NEEDS_TOAST[type]);
    return;
  }

  // Restart progress when aiming at a new tile.
  if (mining.x !== tx || mining.y !== ty) mining = { x: tx, y: ty, progress: 0, need: framesNeeded };
  mining.need = framesNeeded;
  mining.progress++;
  if (mining.progress % 4 === 1) spawnDebris(tx, ty, type, 1);   // small chips fly off while you dig
  if (mining.progress < framesNeeded) return;
  mining.progress = 0;
  spawnDebris(tx, ty, type, 12);                                  // burst when the block breaks

  // Break the tile and collect what it drops.
  if (isDoorTile(type)) removeDoor(tx, ty);
  else setTile(tx, ty, AIR);
  addItem(dropFor(type), type === BUSH ? 1 + (Math.random() < 0.5 ? 1 : 0) : 1);   // a bush gives 2-3 berries; trees give only wood now
}

// Place a material (dirt, stone, ore, wood, leaves, platform or door) under the mouse.
function placeItem(id) {
  const tx = Math.floor(mouseWorldX() / TILE), ty = Math.floor(mouseWorldY() / TILE);
  if (!isPlaceable(id) || itemCount(id) < 1 || ty < 2 || !mouseInReach(tx, ty)) return;

  // Doors are 2 tiles tall: the clicked tile is the bottom half.
  const cells = id === 'door' ? [[tx, ty], [tx, ty - 1]] : [[tx, ty]];
  const type = ITEMS[id].tile;
  if (cells.some(([x, y]) => getTile(x, y) !== AIR)) return;

  cells.forEach(([x, y]) => setTile(x, y, type));
  if (collides(player)) {                                    // don't entomb the player
    cells.forEach(([x, y]) => setTile(x, y, AIR));
    return;
  }
  inventory[id]--;
  cooldown = 5;
  if (id === 'ore') checkBossSummon(tx, ty);
}

function mouseInReach(tx, ty) {
  const px = player.x + player.w / 2, py = player.y + 8;
  return Math.hypot(tx * TILE + 8 - px, ty * TILE + 8 - py) <= REACH;
}

// Right-click: open/close a door under the mouse, otherwise place the selected
// placeable (blocks if a weapon or the pickaxe is selected).
function rightClick() {
  const tx = Math.floor(mouseWorldX() / TILE), ty = Math.floor(mouseWorldY() / TILE);
  if (isDoorTile(getTile(tx, ty)) && mouseInReach(tx, ty)) {
    if (cooldown <= 0) { toggleDoor(tx, ty); cooldown = 15; }
    return;
  }
  placeItem(isPlaceable(heldItem()) ? heldItem() : 'dirt');
}

// ---- Doors ----
const isDoorTile = t => t === DOOR || t === DOOR_OPEN;

// A door is a vertical stack of door tiles; run fn(tileY) on each one.
function forEachDoorTile(x, y, fn) {
  let top = y;
  while (isDoorTile(getTile(x, top - 1))) top--;
  for (let ty = top; isDoorTile(getTile(x, ty)); ty++) fn(ty);
}
function removeDoor(x, y) { forEachDoorTile(x, y, ty => setTile(x, ty, AIR)); }
function toggleDoor(x, y) {
  const closing = getTile(x, y) === DOOR_OPEN;
  const next = closing ? DOOR : DOOR_OPEN;
  forEachDoorTile(x, y, ty => setTile(x, ty, next));
  if (closing && collides(player)) {                         // can't close on the player
    forEachDoorTile(x, y, ty => setTile(x, ty, DOOR_OPEN));
  }
}

// =====================================================================
// 7. ENEMIES
// =====================================================================
// Try to spawn an enemy 20-35 tiles to the side of the player, standing on solid ground.
function spawnEnemy() {
// Flyers start spawning after the Slime King is killed
  const flyerCount = enemies.filter(e => e.kind === 'eyelet' || e.kind === 'purple_eyelet' || e.kind === 'golden_eyelet').length;
  if (slimeKingDefeated && Math.random() < 0.25 && flyerCount < 4) {
    if (eyeDefeated && hasInfiniteWings && Math.random() < 0.10) {        // after the Infinite Wings: golden eyelets (rare) replace purple ones
      spawnGoldenEyelet();
    } else if (eyeDefeated && !hasInfiniteWings && Math.random() < 0.3) {
      spawnPurpleEyelet();
    } else {
      spawnEyelet();

    }
    return;
  }
  const playerTileX = Math.floor(player.x / TILE), playerTileY = Math.floor(player.y / TILE);
  const side = Math.random() < 0.5 ? -1 : 1;
  const tx = playerTileX + side * (20 + Math.floor(Math.random() * 15));
  if (tx < 2 || tx > WORLD_W - 3) return;

  for (let ty = playerTileY - 15; ty < playerTileY + 15; ty++) {
    const roomAbove = getTile(tx, ty) === AIR && getTile(tx, ty - 1) === AIR && getTile(tx, ty - 2) === AIR;
    const ground = isSolid(tx, ty + 1);
    if (!roomAbove || !ground) continue;

    const roll = Math.random();
    if (roll < 0.35) {           // zombie: tall, walks toward you
      enemies.push({ kind: 'zombie', x: tx * TILE, y: (ty - 1) * TILE, w: 12, h: 26,
                     vx: 0, vy: 0, hp: 50, maxHp: 50, damage: 15, hopTimer: 0 });
    } else if (roll < 0.6) {     // green slime: tougher than the blue one
      enemies.push({ kind: 'green', x: tx * TILE, y: (ty + 1) * TILE - 14, w: 16, h: 14,
                     vx: 0, vy: 0, hp: 40, maxHp: 40, damage: 12, hopTimer: 30 });
    } else {                     // blue slime: short, hops toward you
      enemies.push({ kind: 'slime', x: tx * TILE, y: (ty + 1) * TILE - 12, w: 14, h: 12,
                     vx: 0, vy: 0, hp: 30, maxHp: 30, damage: 10, hopTimer: 30 });
    }
    return;
  }
}

// ---- Boss ----
// Five ore blocks in an upside-down T (a bar of 3 with a stem of 2 going up) summon it.
// Checked every time you place an ore block.
function checkBossSummon(tx, ty) {
  if (enemies.some(e => e.kind === 'boss')) return;        // only one at a time
  for (let cx = tx - 1; cx <= tx + 1; cx++) {
    for (let cy = ty; cy <= ty + 2; cy++) {                // (cx, cy) = bottom-center of the T
      const cells = [[cx - 1, cy], [cx, cy], [cx + 1, cy], [cx, cy - 1], [cx, cy - 2]];
      if (!cells.every(([x, y]) => getTile(x, y) === ORE)) continue;
      cells.forEach(([x, y]) => setTile(x, y, AIR));       // the ore is consumed
      spawnBoss(cx * TILE + TILE / 2, (cy - 2) * TILE);
      return;
    }
  }
}

function spawnBoss(centerX, topY) {
  const boss = { kind: 'boss', x: centerX - 24, y: topY - 40, w: 48, h: 36, vx: 0, vy: 0,
                 hp: 1000, maxHp: 1000, damage: 25, hopTimer: 60, shootTimer: 150 };
  for (let i = 0; i < 40 && collides(boss); i++) boss.y -= TILE;   // don't spawn inside terrain
  enemies.push(boss);
  showToast('The Slime King awakens!');
}

// Every so often, shoot a slime ball at the player (shoots faster below 50% HP)
function bossShoot(e) {
  if (--e.shootTimer > 0) return;
  const enraged = e.hp < e.maxHp / 2;
  e.shootTimer = enraged ? 50 + Math.random() * 50 : 110 + Math.random() * 110; // Twice as fast when enraged
  
  const sx = e.x + e.w / 2, sy = e.y + 8;
  const dx = player.x + player.w / 2 - sx, dy = player.y + player.h / 2 - sy;
  const len = Math.hypot(dx, dy) || 1;
  if (len > 500) return;
  slimeBalls.push({ x: sx, y: sy, vx: dx / len * 3, vy: dy / len * 3, life: 240 });
}

function updateSlimeBalls() {
  for (const b of slimeBalls) {
    b.x += b.vx; b.y += b.vy; b.life--;
    // Wall collision removed: projectiles now pass through blocks
    const hitsPlayer = b.x > player.x - 4 && b.x < player.x + player.w + 4 &&
                       b.y > player.y - 4 && b.y < player.y + player.h + 4;
    if (hitsPlayer && player.invincibleFrames <= 0) {
      player.hp -= 25; // Increased to 25 damage
      player.invincibleFrames = 45;
      player.vx = Math.sign(b.vx) * 2.5;
      player.vy = -2.5;
      b.life = 0;
    }
  }
  slimeBalls = slimeBalls.filter(b => b.life > 0);
}

function drawBossBar() {
  ctx.save(); ctx.scale(UI_SCALE, UI_SCALE);
  try { drawBossBarInner(); } finally { ctx.restore(); }
}
function drawBossBarInner() {
  const boss = enemies.find(e => e.kind === 'boss' || e.kind === 'eye' || e.kind === 'descendant');
  if (!boss) return;
  const w = Math.min(420, uiW() - 40);
  const x = (uiW() - w) / 2, y = uiH() - 56;

  // Background and fill
  ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(x - 3, y - 3, w + 6, 20);
  ctx.fillStyle = boss.kind === 'descendant' ? descColor(boss) : boss.kind === 'eye' ? '#d33' : '#2bd4c0';
  ctx.fillRect(x, y, w * Math.max(0, boss.hp) / boss.maxHp, 14);

  // Boss Name (above the bar)
  ctx.fillStyle = '#fff';
  ctx.font = '12px system-ui, sans-serif';
  const name = boss.kind === 'descendant' ? 'Descendant \u2014 ' + (boss.mode === 'ranged' ? 'ranged only' : 'melee only')
             : boss.kind === 'eye' ? 'Big Bad Eye' : 'Slime King';
  ctx.fillText(name, (uiW() - ctx.measureText(name).width) / 2, y - 8);

  // Health numbers (centered inside the bar)
  const hpText = Math.ceil(Math.max(0, boss.hp)) + ' / ' + boss.maxHp;
  ctx.font = '10px system-ui, sans-serif';
  ctx.shadowColor = '#000';
  ctx.shadowBlur = 3;
  ctx.fillText(hpText, (uiW() - ctx.measureText(hpText).width) / 2, y + 11);
  ctx.shadowBlur = 0;
}

// ---- Big Bad Eye (second boss) and eyelets ----
// The Occult Book summons the boss. It only drops from zombies after the Slime King is dead.

// Healing potion: restores 50 health, but only if you have potions in your hotbar
function usePotion() {
  // Checks if 'potion' is in the hotbar AND you have at least 1
  if (!hotbar.includes('potion') || itemCount('potion') < 1 || player.hp >= maxHp || cooldown > 0) return;

  player.hp = Math.min(maxHp, player.hp + 25);
  inventory.potion--;

  // If you used your last potion, remove it from the hotbar slot
  if (inventory.potion <= 0) {
    const slot = hotbar.indexOf('potion');
    if (slot >= 0) hotbar[slot] = null;
  }

  cooldown = 30;
}
function useBook() {
  if (itemCount('book') < 1 || !slimeKingDefeated) return;
  if (enemies.some(e => e.kind === 'eye')) return;
  inventory.book--;
  cooldown = 30;
  enemies.push({ kind: 'eye', x: player.x - 20, y: player.y - 260, w: 40, h: 40, vx: 0, vy: 0,
                 hp: 5000, maxHp: 5000, damage: 25, state: 'hover', timer: 120, dashes: 0, t: 0 });
  showToast('The Big Bad Eye watches you...');
}

// The Descendant can only be summoned once the Big Bad Eye is defeated AND you have crafted the Infinite Wings.

  if (itemCount('sigil') < 1) return;

    return;
  }

}

function spawnPurpleEyelet() {

  enemies.push({ kind: 'purple_eyelet', x: player.x + side * (260 + Math.random() * 120),
                 y: player.y - 40 - Math.random() * 100, w: 14, h: 14, vx: 0, vy: 0,
                 hp: 35, maxHp: 35, damage: 14, t: Math.random() * 100 });

function spawnGoldenEyelet() {

  enemies.push({ kind: 'golden_eyelet', x: player.x + side * (260 + Math.random() * 120),

                 hp: 100, maxHp: 100, damage: 20, t: Math.random() * 100 });
